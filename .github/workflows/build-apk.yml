name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        working-directory: jarvis/livekit_flutter_starter
        run: flutter pub get

      - name: Build release APK
        working-directory: jarvis/livekit_flutter_starter
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: jarvis/livekit_flutter_starter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
